name: glass_board
description: "GlassBoard - Transparent inter-department workflow and bottleneck dependency management platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_storage: ^11.7.4
  firebase_database: ^10.5.4
  firebase_messaging: ^14.9.4
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  file_picker: ^8.0.0
  uuid: ^4.3.3
  timeago: ^3.6.1
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
